name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (Supabase migrations)
    runs-on: ubuntu-latest
    # Solo ejecutar si hay cambios en supabase/ o src/
    if: github.event.before != github.event.after
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar cambios relevantes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            supabase:
              - 'supabase/**'
              - '.github/workflows/cd.yml'

      - name: Instalar Supabase CLI
        if: steps.changes.outputs.supabase == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: "latest"

      - name: Aplicar migraciones a Supabase
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Aplicar seed (solo staging/preview)
        if: steps.changes.outputs.supabase == 'true' && github.ref != 'refs/heads/main'
        run: supabase db seed --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # --- Deploy alternativo: construir imagen Docker ----------------------
      # Descomenta/customiza si despliegas en container (Fly.io, Railway, etc.)
