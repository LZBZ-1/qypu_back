name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supabase:
    name: Migraciones Supabase
    runs-on: ubuntu-latest
    if: github.event.before != github.event.after
    outputs:
      supabase_changed: ${{ steps.changes.outputs.supabase }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar cambios en supabase/
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            supabase:
              - 'supabase/**'
              - '.github/workflows/cd.yml'

      - name: Instalar Supabase CLI
        if: steps.changes.outputs.supabase == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: "latest"

      - name: Aplicar migraciones a Supabase
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Aplicar seed (solo staging/preview)
        if: steps.changes.outputs.supabase == 'true' && github.ref != 'refs/heads/main'
        run: supabase db seed --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  railway:
    name: Deploy Railway
    runs-on: ubuntu-latest
    needs: supabase
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy a Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}